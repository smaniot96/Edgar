# Secret-free runtime profiles. Credentials stay in OPENAI_API_KEY / the image provider's
# environment credential. Editing this file is picked up on the next request; each request
# and durable preparation run freezes a complete snapshot at entry.
schema_version = 1
profile_version = "3"

# max_input_tokens is the estimated prompt budget (see docs/runtime-model-profiles.md); play
# prompts drop the oldest verbatim history to fit it. Omit it to leave a stage unbounded.
# Play profiles inherit model and reasoning effort from legacy LLM_MODEL and
# LLM_REASONING_EFFORT unless a particular profile sets its own model/effort.
[profiles.play.default]

[profiles.play.parser]
max_input_tokens = 32000
max_output_tokens = 800

[profiles.play.consequence_planner]
max_input_tokens = 32000
max_output_tokens = 1800

[profiles.play.narrator]
max_input_tokens = 32000
max_output_tokens = 1600

[profiles.play.combat_builder]
max_output_tokens = 1200

[profiles.play.combat_narrator]
max_input_tokens = 32000
max_output_tokens = 1000

[profiles.play.memory_summarizer]
max_input_tokens = 32000
max_output_tokens = 800

[profiles.play.session_intro]
max_output_tokens = 2200

# Campaign preparation semantic work is deliberately policy-bound. The loader rejects a
# file that attempts to change these settings; no account access is claimed by this config.

[images.image.adventure_map]
model = "gpt-image-1"
size = "1536x1024"
quality = "medium"
output_format = "png"
timeout_seconds = 180
retries = 2

[images.image.illustration]
model = "gpt-image-1"
size = "1024x1024"
quality = "medium"
output_format = "png"
timeout_seconds = 180
retries = 2

[images.image.creature_art]
model = "gpt-image-1"
size = "1024x1024"
quality = "medium"
output_format = "png"
timeout_seconds = 180
retries = 2

# Campaign semantic roles are policy-bound to gpt-6-luna / medium.
