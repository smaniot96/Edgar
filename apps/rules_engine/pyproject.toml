[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rules-engine"
version = "0.1.0"
description = "Rules engine for D&D campaign logic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "db",
    "edgar_core",
    "pydantic>=2.12.5",
]

[project.scripts]
rules-engine = "rules_engine.main:main"

[tool.setuptools.packages.find]
where = ["src"]
