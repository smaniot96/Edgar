<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edgar</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #101216; color: #e6e6e6; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 16px; border-bottom: 1px solid #222; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 720px; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
    .user { background: #1f3a5f; margin-left: auto; }
    .dm { background: #1f1f23; margin-right: auto; }
    footer { padding: 12px; border-top: 1px solid #222; display: flex; gap: 8px; align-items: flex-end; }
    textarea { flex: 1; background: #1a1c20; color: #e6e6e6; border: 1px solid #333; border-radius: 6px; padding: 8px; resize: vertical; min-height: 44px; font-family: inherit; font-size: 14px; }
    button { background: #3b82f6; border: 0; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .pill { padding: 2px 8px; border-radius: 999px; background: #222; font-size: 12px; }
    .title { font-size: 1.05rem; margin-right: auto; }
    #turn-status { opacity: 0.85; font-style: italic; }
  </style>
</head>
<body>
<header>
  <strong class="title" id="title">Edgar</strong>
  <span class="pill" id="char">—</span>
  <span class="pill" id="hp">HP —/—</span>
  <span class="pill" id="scene">scene —</span>
  <span class="pill" id="turn-status" hidden></span>
</header>
<div id="log" aria-live="polite"><div class="msg dm" id="loading-msg">Loading...</div></div>
<footer>
  <textarea id="input" rows="2" placeholder="What do you do?" aria-label="Your action"></textarea>
  <button type="button" id="send">Send</button>
</footer>
<script>
let sessionId = null;

async function ensureSession() {
  const r = await fetch('/api/seed', { method: 'POST' });
  if (!r.ok) {
    document.getElementById('loading-msg')?.remove();
    appendMsg('dm', `[seed failed ${r.status}: ${await r.text()}]`);
    return;
  }
  const j = await r.json();
  sessionId = j.session_id;
  document.getElementById('loading-msg')?.remove();
  await refreshHeader();
  await loadHistory();
}

async function refreshHeader() {
  const sRes = await fetch(`/api/sessions/${sessionId}`);
  if (!sRes.ok) return;
  const s = await sRes.json();
  document.getElementById('scene').textContent = `scene ${s.current_scene_id || '—'}`;
  try {
    const cRes = await fetch(`/api/campaigns/${s.campaign_id}`);
    if (cRes.ok) {
      const camp = await cRes.json();
      document.getElementById('title').textContent = camp.title || 'Edgar';
    }
  } catch (_) { /* keep default title */ }
  if (s.active_character_id) {
    const cRes = await fetch(`/api/characters/${s.active_character_id}`);
    if (!cRes.ok) return;
    const c = await cRes.json();
    document.getElementById('char').textContent = `${c.name} (L${c.level} ${c.character_class})`;
    document.getElementById('hp').textContent = `HP ${c.hp_current}/${c.hp_max}`;
  } else {
    document.getElementById('char').textContent = '—';
    document.getElementById('hp').textContent = 'HP —/—';
  }
}

async function loadHistory() {
  const log = document.getElementById('log');
  log.innerHTML = '';
  const r = await fetch(`/api/sessions/${sessionId}/messages`);
  if (!r.ok) {
    appendMsg('dm', `[could not load history: ${r.status}]`);
    return;
  }
  const msgs = await r.json();
  for (const m of msgs) appendMsg(m.role, m.content);
}

function appendEmptyMsg(role) {
  const log = document.getElementById('log');
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = '';
  log.appendChild(el);
  el.scrollIntoView({ block: 'end', behavior: 'smooth' });
  return el;
}

function updateStatus(stage) {
  const el = document.getElementById('turn-status');
  if (!stage) {
    el.hidden = true;
    el.textContent = '';
    return;
  }
  const labels = {
    parsing: 'Parsing…',
    retrieving: 'Searching rules…',
    adjudicating: 'Adjudicating…',
    narrating: 'Narrating…',
    saving: 'Saving…',
  };
  el.textContent = labels[stage] || stage;
  el.hidden = false;
}

function appendMsg(role, content) {
  const log = document.getElementById('log');
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = content;
  log.appendChild(el);
  el.scrollIntoView({ block: 'end', behavior: 'smooth' });
}

async function send() {
  const ta = document.getElementById('input');
  const msg = ta.value.trim();
  if (!msg) return;
  const btn = document.getElementById('send');
  btn.disabled = true;
  ta.disabled = true;
  appendMsg('user', msg);
  ta.value = '';
  updateStatus('parsing');
  let dmEl = null;
  try {
    const r = await fetch(`/api/sessions/${sessionId}/turn/stream`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });
    if (!r.ok) {
      updateStatus('');
      const detail = await r.text();
      appendMsg('dm', `[error ${r.status}: ${detail}]`);
      await refreshHeader();
      return;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const lines = frame.split('\n');
        let evt = '';
        let data = '';
        for (const ln of lines) {
          if (ln.startsWith('event:')) evt = ln.slice(6).trim();
          else if (ln.startsWith('data:')) data += ln.slice(5).trim();
        }
        let j = {};
        if (data) {
          try {
            j = JSON.parse(data);
          } catch (_) {
            j = {};
          }
        }
        if (evt === 'status') updateStatus(j.stage);
        else if (evt === 'token') {
          if (!dmEl) dmEl = appendEmptyMsg('dm');
          dmEl.textContent += j.text || '';
          dmEl.scrollIntoView({ block: 'end', behavior: 'smooth' });
        }         else if (evt === 'done') {
          updateStatus('');
          if (!dmEl) {
            dmEl = appendEmptyMsg('dm');
            dmEl.textContent = j.narration && String(j.narration).trim()
              ? j.narration
              : '[no narration]';
          }
          await refreshHeader();
        } else if (evt === 'error') {
          updateStatus('');
          if (!dmEl) dmEl = appendEmptyMsg('dm');
          dmEl.textContent += (dmEl.textContent ? '\n' : '') + `[error: ${j.detail || 'unknown'}]`;
        }
      }
    }
    updateStatus('');
    await refreshHeader();
  } catch (e) {
    updateStatus('');
    appendMsg('dm', `[network error: ${e}]`);
  } finally {
    btn.disabled = false;
    ta.disabled = false;
    ta.focus();
  }
}

document.getElementById('send').addEventListener('click', send);
document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

ensureSession();
</script>
</body>
</html>
