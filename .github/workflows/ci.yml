name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same uv as the one that writes uv.lock, so `--locked` / `--frozen` agree on the format.
  UV_VERSION: "0.9.9"

jobs:
  edgar-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync workspace and dev tools
        run: uv sync --locked --group dev

      # Lint only; formatting is applied in a separate pass and not enforced here yet.
      - name: Ruff check (monorepo)
        run: uv run ruff check .

  edgar-tests:
    runs-on: ubuntu-latest
    env:
      # conftest turns "Docker unavailable" into a failure (instead of a skip) when CI is set.
      CI: "true"
      OPENAI_API_KEY: test-key-for-ci
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync workspace and dev tools
        run: uv sync --locked --group dev

      - name: Run pytest
        run: uv run pytest tests/ --tb=short

  edgar-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edgar
          POSTGRES_PASSWORD: edgar
          POSTGRES_DB: edgar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edgar -d edgar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      POSTGRES_USER: edgar
      POSTGRES_PASSWORD: edgar
      POSTGRES_DB: edgar
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync workspace and dev tools
        run: uv sync --locked --group dev

      - name: Apply all migrations
        working-directory: db
        run: uv run --project .. python -m alembic upgrade head

      - name: Models match migrations (alembic check)
        working-directory: db
        run: uv run --project .. python -m alembic check

      - name: Latest migration downgrades and re-applies
        working-directory: db
        run: |
          uv run --project .. python -m alembic downgrade -1
          uv run --project .. python -m alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha

  stack-smoke:
    runs-on: ubuntu-latest
    env:
      # Unique per run: volumes and networks are project-scoped, so no live data is reused or removed.
      COMPOSE_PROJECT_NAME: edgar-smoke-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      # Compose needs .env for env_file. The API refuses the example's placeholder key at startup,
      # so use a syntactically valid dummy: it is never sent anywhere because the smoke makes no model call.
      - name: Create env file with a dummy provider key
        run: |
          cp .env.example .env
          sed -i 's/^OPENAI_API_KEY=.*/OPENAI_API_KEY=sk-ci-smoke-not-a-real-key/' .env

      - name: Validate base and dev Compose configs
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Build, migrate and smoke-test the stack
        run: bash tools/smoke_stack.sh

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail=200

      - name: Tear down stack and volumes
        if: always()
        run: docker compose -f docker-compose.yml down -v --rmi local

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync locked Python workspace and dev tools
        run: uv sync --locked --group dev

      - name: Audit locked Python dependencies
        run: uv run python tools/check_python_dependencies.py

      - name: Check ingestion readiness type contracts
        run: uv run python tools/check_readiness_types.py

      - name: Bandit SAST
        # Gate medium/high severity findings only at high confidence; see docs/ci-security.md.
        run: uv run python tools/check_bandit.py

      - name: Report readiness coverage
        run: >-
          uv run pytest tests/test_ingestion_readiness.py
          --cov=ingestion.readiness --cov-report=term-missing --cov-fail-under=90

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend lockfile
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Install pinned Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.28.0_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o "$archive"
          printf '%s  %s\n' a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify secret detection and scan tracked tree
        run: uv run python tools/check_tracked_secrets.py
