# Settings come from .env, interpolated by Compose into a per-service allow-list (no service gets
# the whole file). Only host names are overridden so containers use the Docker network.
# No URL construction or credential duplication here. Hosting profile: docker-compose.hosting.yml.
#
# `docker compose up -d` starts the runtime stack only: api + db + redis + qdrant.
# One-off jobs live behind profiles and are run explicitly (the Makefile wraps them):
#   docker compose run --rm migrate                      (profile: tools; `make migrate`)
#   docker compose run --rm ingestion /data/x.pdf ...    (profile: tools; `make ingest`)
#   docker compose --profile rules run --rm rules_engine (rules-only RAG demo)
# `make build` builds api + migrate. `make up` migrates, starts, waits for /health, seeds.
# `make dev-up` explicitly adds docker-compose.dev.yml for source mounts + API hot reload.
#
# All published ports, including the API, bind to 127.0.0.1 for local use.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrate:
    logging: *default-logging
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Database coordinates only: migrations read no provider, Redis or Qdrant settings.
    environment:
      - DB_HOST=db
      - "DB_PORT=${DB_PORT:-5432}"
      - "POSTGRES_USER=${POSTGRES_USER:-user}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}"
      - "POSTGRES_DB=${POSTGRES_DB:-dnd}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: dnd-api
    # Runs as the image's non-root `edgar` user on port 8000 and needs no Linux capability.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Per-service allow-list: every value is interpolated from the host's .env (or shell) at
    # `compose` time, and only the names below reach this container. Each default equals the
    # default in edgar_core.config / model_profiles, so an absent .env behaves as before.
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - EDGAR_INDEX_LOCK_DIR=/index-locks
      - "ENV=${ENV:-local}"
      - "DB_PORT=${DB_PORT:-5432}"
      - "POSTGRES_USER=${POSTGRES_USER:-user}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}"
      - "POSTGRES_DB=${POSTGRES_DB:-dnd}"
      - "REDIS_PORT=${REDIS_PORT:-6379}"
      - "QDRANT_PORT=${QDRANT_PORT:-6333}"
      # The API validates the provider key at startup and calls the model and embedding APIs.
      - "OPENAI_API_KEY=${OPENAI_API_KEY:-}"
      - "VECTOR_DB_API_KEY=${VECTOR_DB_API_KEY:-}"
      - "LLM_MODEL=${LLM_MODEL:-gpt-6-luna}"
      - "LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-low}"
      - "EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}"
      - "MODEL_PROFILES_PATH=${MODEL_PROFILES_PATH:-}"
      - "EDGAR_DEBUG=${EDGAR_DEBUG:-0}"
      - "EDGAR_COMBAT_GRID=${EDGAR_COMBAT_GRID:-0}"
      - "EDGAR_METRICS_ENABLED=${EDGAR_METRICS_ENABLED:-}"
      - "EDGAR_METRICS_TOKEN=${EDGAR_METRICS_TOKEN:-}"
      # Summary bound (EDG-158), origin policy (EDG-052) and auth mode (EDG-065); empty means the code default.
      - "EDGAR_MEMORY_SUMMARY_CONCURRENCY=${EDGAR_MEMORY_SUMMARY_CONCURRENCY:-}"
      - "EDGAR_ALLOWED_ORIGINS=${EDGAR_ALLOWED_ORIGINS:-}"
      - "EDGAR_ALLOW_CREDENTIALS=${EDGAR_ALLOW_CREDENTIALS:-}"
      - "EDGAR_TRUSTED_HOSTS=${EDGAR_TRUSTED_HOSTS:-}"
      - "EDGAR_AUTH_MODE=${EDGAR_AUTH_MODE:-}"
      - "EDGAR_ADMIN_USER_IDS=${EDGAR_ADMIN_USER_IDS:-}"
      - "EDGAR_ALLOW_DEBUG_IN_TOKEN_MODE=${EDGAR_ALLOW_DEBUG_IN_TOKEN_MODE:-}"
      # Single-replica guard (EDG-074); empty means the code default (enforced, 10 s wait).
      - "EDGAR_ALLOW_MULTIPLE_REPLICAS=${EDGAR_ALLOW_MULTIPLE_REPLICAS:-}"
      - "EDGAR_REPLICA_LOCK_WAIT_SEC=${EDGAR_REPLICA_LOCK_WAIT_SEC:-}"
      # Request, upload and spend limits (EDG-066); empty means the code default.
      - "LIMIT_TURNS_PER_MINUTE=${LIMIT_TURNS_PER_MINUTE:-}"
      - "LIMIT_JOB_STARTS_PER_HOUR=${LIMIT_JOB_STARTS_PER_HOUR:-}"
      - "LIMIT_MAX_CONCURRENT_TURNS=${LIMIT_MAX_CONCURRENT_TURNS:-}"
      - "LIMIT_MAX_CONCURRENT_TURNS_PER_CLIENT=${LIMIT_MAX_CONCURRENT_TURNS_PER_CLIENT:-}"
      - "LIMIT_MAX_CONCURRENT_JOBS=${LIMIT_MAX_CONCURRENT_JOBS:-}"
      - "LIMIT_MAX_UPLOAD_BYTES=${LIMIT_MAX_UPLOAD_BYTES:-}"
      - "LIMIT_DAILY_SPEND_MICROUSD=${LIMIT_DAILY_SPEND_MICROUSD:-}"
      - "LIMIT_ASSUMED_CALL_COST_MICROUSD=${LIMIT_ASSUMED_CALL_COST_MICROUSD:-}"
      - "LIMIT_UNBUDGETED_JOB_COST_MICROUSD=${LIMIT_UNBUDGETED_JOB_COST_MICROUSD:-}"
      - "LIMIT_TURN_LEASE_SECONDS=${LIMIT_TURN_LEASE_SECONDS:-}"
      - "LIMIT_JOB_LEASE_SECONDS=${LIMIT_JOB_LEASE_SECONDS:-}"
      - "EDGAR_TRUSTED_IMAGE_PRICE_RECORD=${EDGAR_TRUSTED_IMAGE_PRICE_RECORD:-}"
      - "EDGAR_VISUAL_REVIEW_PUBLIC_KEY=${EDGAR_VISUAL_REVIEW_PUBLIC_KEY:-}"
      - "EDGAR_VISUAL_REVIEW_PRIVATE_KEY=${EDGAR_VISUAL_REVIEW_PRIVATE_KEY:-}"
    # Localhost only: the API has no authentication yet, so don't expose it to the network.
    ports:
      - "127.0.0.1:8000:8000"
    # Uploaded campaign PDFs + adventure metadata persist here (shared with the ingestion
    # service's /data). Without this, UI uploads would be lost on container recreate.
    volumes:
      - ./data:/data
      - ./data/.index-locks:/index-locks
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  ingestion:
    logging: *default-logging
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ingestion
    container_name: dnd-ingestion
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Embeddings need the provider key; no Postgres credentials (the ingest path never opens the DB).
    environment:
      - DB_HOST=db
      - QDRANT_HOST=qdrant
      - EDGAR_INDEX_LOCK_DIR=/index-locks
      - "QDRANT_PORT=${QDRANT_PORT:-6333}"
      - "OPENAI_API_KEY=${OPENAI_API_KEY:-}"
      - "VECTOR_DB_API_KEY=${VECTOR_DB_API_KEY:-}"
      - "LLM_MODEL=${LLM_MODEL:-gpt-6-luna}"
      - "LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-low}"
      - "EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}"
      - "MODEL_PROFILES_PATH=${MODEL_PROFILES_PATH:-}"
    volumes:
      - ./data/pdfs:/data
      - ./data/markdown:/output/markdown
      - ./data/.index-locks:/index-locks
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: "no"

  rules_engine:
    logging: *default-logging
    profiles: ["rules"]
    build:
      context: .
      dockerfile: Dockerfile
      target: rules_engine
    container_name: dnd-rules-engine
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data/.index-locks:/index-locks
    # Rules retrieval embeds the query (provider key) and reads Qdrant; no Postgres credentials.
    environment:
      - DB_HOST=db
      - QDRANT_HOST=qdrant
      - EDGAR_INDEX_LOCK_DIR=/index-locks
      - "QDRANT_PORT=${QDRANT_PORT:-6333}"
      - "OPENAI_API_KEY=${OPENAI_API_KEY:-}"
      - "VECTOR_DB_API_KEY=${VECTOR_DB_API_KEY:-}"
      - "LLM_MODEL=${LLM_MODEL:-gpt-6-luna}"
      - "LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-low}"
      - "EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}"
      - "MODEL_PROFILES_PATH=${MODEL_PROFILES_PATH:-}"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: "no"

  db:
    logging: *default-logging
    image: postgres:16
    container_name: dnd-db
    # Interpolated from .env by Compose; the database container receives no provider secrets.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-dnd}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    # Pinned to the version the dev stack has been running (was `redis:latest` = 8.6.3).
    image: redis:8.6.3
    container_name: dnd-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    logging: *default-logging
    # Pinned to the version the dev stack has been running (was untagged = v1.16.3).
    image: qdrant/qdrant:v1.16.3
    container_name: dnd-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      # Persist collections/vectors across container recreates (no rebuild needed for qdrant)
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    # qdrant/qdrant image has bash but not curl/wget; TCP probe matches readiness.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
