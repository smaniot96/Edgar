# Uses .env via env_file. Only overrides host names so containers use the Docker network.
# No URL construction or credential duplication here.
#
# `docker compose up -d` starts the runtime stack only: api + db + redis + qdrant.
# One-off jobs live behind profiles and are run explicitly (the Makefile wraps them):
#   docker compose run --rm migrate                      (profile: tools; `make migrate`)
#   docker compose run --rm ingestion /data/x.pdf ...    (profile: tools; `make ingest`)
#   docker compose --profile rules run --rm rules_engine (rules-only RAG demo)
# `make build` builds api + migrate. `make up` migrates, starts, waits for /health, seeds.
# `make dev-up` explicitly adds docker-compose.dev.yml for source mounts + API hot reload.
#
# All published ports, including the API, bind to 127.0.0.1 for local use.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrate:
    logging: *default-logging
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file: .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: dnd-api
    env_file: .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - EDGAR_INDEX_LOCK_DIR=/index-locks
    # Localhost only: the API has no authentication yet, so don't expose it to the network.
    ports:
      - "127.0.0.1:8000:8000"
    # Uploaded campaign PDFs + adventure metadata persist here (shared with the ingestion
    # service's /data). Without this, UI uploads would be lost on container recreate.
    volumes:
      - ./data:/data
      - ./data/.index-locks:/index-locks
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  ingestion:
    logging: *default-logging
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ingestion
    container_name: dnd-ingestion
    env_file: .env
    environment:
      - DB_HOST=db
      - QDRANT_HOST=qdrant
      - EDGAR_INDEX_LOCK_DIR=/index-locks
    volumes:
      - ./data/pdfs:/data
      - ./data/markdown:/output/markdown
      - ./data/.index-locks:/index-locks
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: "no"

  rules_engine:
    logging: *default-logging
    profiles: ["rules"]
    build:
      context: .
      dockerfile: Dockerfile
      target: rules_engine
    container_name: dnd-rules-engine
    volumes:
      - ./data/.index-locks:/index-locks
    env_file: .env
    environment:
      - DB_HOST=db
      - QDRANT_HOST=qdrant
      - EDGAR_INDEX_LOCK_DIR=/index-locks
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: "no"

  db:
    logging: *default-logging
    image: postgres:16
    container_name: dnd-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-dnd}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    # Pinned to the version the dev stack has been running (was `redis:latest` = 8.6.3).
    image: redis:8.6.3
    container_name: dnd-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    logging: *default-logging
    # Pinned to the version the dev stack has been running (was untagged = v1.16.3).
    image: qdrant/qdrant:v1.16.3
    container_name: dnd-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      # Persist collections/vectors across container recreates (no rebuild needed for qdrant)
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    # qdrant/qdrant image has bash but not curl/wget; TCP probe matches readiness.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
