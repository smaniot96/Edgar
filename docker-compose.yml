# Uses .env via env_file. Only overrides host names so containers use the Docker network.
# No URL construction or credential duplication here.
#
# Start without rebuilding images: docker compose up -d --no-build
# (Qdrant/Postgres/Redis use images from Docker Hub; app services use pre-built edgar-* images.)

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file: .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: dnd-api
    env_file: .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    ports:
      - "8000:8000"
    # Uploaded campaign PDFs + adventure metadata persist here (shared with the ingestion
    # service's /data). Without this, UI uploads would be lost on container recreate.
    volumes:
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
      target: ingestion
    container_name: dnd-ingestion
    env_file: .env
    environment:
      - DB_HOST=db
      - QDRANT_HOST=qdrant
    volumes:
      - ./data/pdfs:/data
      - ./data/markdown:/output/markdown
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  rules_engine:
    build:
      context: .
      dockerfile: Dockerfile
      target: rules_engine
    container_name: dnd-rules-engine
    env_file: .env
    environment:
      - DB_HOST=db
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: dnd-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-dnd}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: dnd-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    container_name: dnd-qdrant
    ports:
      - "6333:6333"
    volumes:
      # Persist collections/vectors across container recreates (no rebuild needed for qdrant)
      - qdrant_data:/qdrant/storage
    # qdrant/qdrant image has bash but not curl/wget; TCP probe matches readiness.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
