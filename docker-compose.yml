# Uses .env via env_file. Only overrides host names so containers use the Docker network.
# No URL construction or credential duplication here.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.api
    container_name: dnd-api
    env_file: .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - qdrant

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile.agent
    container_name: dnd-agent
    env_file: .env
    environment:
      - DB_HOST=db
    depends_on:
      - db

  ingestion:
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile.ingestion
    container_name: dnd-ingestion
    env_file: .env
    environment:
      - DB_HOST=db
      - QDRANT_HOST=qdrant
    volumes:
      - ../data/pdfs:/data
      - ../data/markdown:/output/markdown
    depends_on:
      - db
      - qdrant

  rules_engine:
    build:
      context: .
      dockerfile: apps/rules_engine/Dockerfile.rules_engine
    container_name: dnd-rules-engine
    env_file: .env
    environment:
      - DB_HOST=db
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: dnd-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    container_name: dnd-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: dnd-qdrant
    ports:
      - "6333:6333"

volumes:
  postgres_data:
